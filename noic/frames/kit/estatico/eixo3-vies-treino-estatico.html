  <p style="margin:0 0 .6em">
    A conta que liga as três colunas, com o teste parado em \(f = 0{,}1\) e o resto em 77,6%:
    \(\displaystyle a_{\mathrm{geral}}(q)=0{,}1\,(22+66q)+0{,}9\times 77{,}6 \qquad a_{B}(q)=22+66q\)
