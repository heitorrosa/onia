<figure class="noic-frame-static">
  <figcaption><strong>Fig. 3</strong> (versão estática): o plano do SMOTE. Sete pontos do grupo concentrados num canto, quarenta do resto espalhados, e a fronteira do classificador de centro mais próximo entre os dois. Cada ponto inventado nasce no segmento entre um ponto do grupo e o vizinho mais próximo dele. Três cruzes marcam casos de teste parados logo acima da fronteira, do lado do resto: elas não se movem, e o que muda é de que lado a fronteira as deixa.</figcaption>

  <p style="margin:0 0 .6em">
    O ponto novo é uma combinação convexa de dois pontos do grupo:
    \(x_{\text{novo}} = (1-\lambda)\,x_1 + \lambda\,x_2\), com \(\lambda \sim U(0,1)\) e \(x_2\) o vizinho mais próximo de \(x_1\) entre os pontos do grupo. O resultado fica no segmento entre os dois, nunca fora dele.
  </p>

  <ol style="margin:0 0 .8em;padding-left:1.2em">
    <li>Sortear um ponto \(x_1\) entre os pontos do grupo.</li>
    <li>Achar \(x_2\), o ponto do grupo mais próximo de \(x_1\) pela distância euclidiana.</li>
    <li>Sortear \(\lambda\) em \((0,1)\).</li>
    <li>Criar o ponto no segmento: \((1-\lambda)\,x_1 + \lambda\,x_2\).</li>
    <li>Recalcular a fronteira, que é a mediatriz entre o centróide do grupo e o do resto, e reconferir de que lado ficaram as três cruzes.</li>
  </ol>

  <p style="margin:0 0 .6em">
    Os números são de uma execução com sorteio fixo. A cada execução os pontos sorteados mudam, e a fronteira pode andar para o lado do grupo em vez do lado do resto: nesse caso ela se afasta das cruzes e nenhuma muda de lado. O que a tabela mostra é o que acontece quando ela anda para o lado delas: o veredito do caso de teste troca sem que o dado dele mude, e a mudança vem de pontos que nasceram no segmento entre dois pontos que já existiam.
  </p>

  <p style="margin:0 0 .6em"><strong>Ponto notável.</strong> Nenhuma ficha nova entrou no conjunto de treino. O que mudou foi a proporção de pontos do grupo em relação ao resto, e com ela a posição da fronteira. O modelo não recebeu informação: recebeu a mesma informação com pesos diferentes.</p>

  <p style="margin:0">Ler a figura com uma pergunta: o que a fronteira ganhou? Ela ganhou alguns pontos de dado que ninguém mediu, e não ganhou nenhuma ficha nova da escola.</p>
