<figure class="noic-frame-static">
  <figcaption><strong>Fig. 3</strong> (versão estática): o plano do SMOTE. Sete pontos do grupo concentrados num canto, quarenta do resto espalhados, e a região que um classificador de três vizinhos mais próximos dá ao grupo, hachurada. Cada ponto inventado nasce no segmento entre um ponto do grupo e o vizinho mais próximo dele, e a região cresce um fio para o lado que ficou mais denso. Três cruzes marcam casos de teste parados a menos de duas unidades da borda, do lado do resto: elas não se movem, e o que muda é se a região chega até elas.</figcaption>

  <p style="margin:0 0 .6em">
    O ponto novo é uma combinação convexa de dois pontos do grupo:
    \(x_{\text{novo}} = (1-\lambda)\,x_1 + \lambda\,x_2\), com \(\lambda \sim U(0,1)\) e \(x_2\) o vizinho mais próximo de \(x_1\) entre os pontos do grupo. O resultado fica no segmento entre os dois, nunca fora dele.
  </p>

  <ol style="margin:0 0 .8em;padding-left:1.2em">
    <li>Sortear um ponto \(x_1\) entre os pontos do grupo.</li>
    <li>Achar \(x_2\), o ponto do grupo mais próximo de \(x_1\) pela distância euclidiana.</li>
    <li>Sortear \(\lambda\) em \((0,1)\).</li>
    <li>Criar o ponto no segmento: \((1-\lambda)\,x_1 + \lambda\,x_2\).</li>
    <li>Recalcular a região: cada célula do plano fica com o grupo quando dois dos seus três vizinhos mais próximos são do grupo. Reconferir se a região chegou às três cruzes.</li>
  </ol>

  <p style="margin:0 0 .6em">
    Os números são de uma execução com sorteio fixo. O que a tabela mostra é que o ganho é densidade, não informação: a contagem de pontos do grupo quadruplica e a região cobre um ponto percentual a mais do plano. Cresce um fio, e cresce depressa, porque o ponto inventado cai onde já havia vizinho do lado. O veredito dos casos de teste troca sem que o dado deles mude.
  </p>

  <p style="margin:0 0 .6em"><strong>Ponto notável.</strong> Nenhuma ficha nova entrou no conjunto de treino. O que mudou foi a densidade do grupo naquele canto do plano, e com ela a borda da região. O modelo não recebeu informação: recebeu a mesma informação mais concentrada.</p>

  <p style="margin:0">Ler a figura com uma pergunta: o que a região ganhou? Ganhou espaço em volta de pontos que já existiam, e não ganhou nenhuma ficha nova da escola.</p>
