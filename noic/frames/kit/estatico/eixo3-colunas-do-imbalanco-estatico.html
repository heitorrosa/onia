  <figcaption><strong>Fig. 4</strong> (versão estática): o conjunto de mil fichas em treino e teste, com 10% de grupo. No corte aleatório a fração do grupo é a mesma nas três colunas em qualquer tamanho de teste; no corte por grupo, turmas inteiras vão para um lado e a fração do teste depende de quais turmas caíram lá.</figcaption>

  <p style="margin:0 0 .4em"><strong>Corte aleatório.</strong> Sorteia fichas, então cada coluna repete a proporção do conjunto, em média.</p>

  <p style="margin:0 0 .4em"><strong>Corte por grupo.</strong> Vinte turmas de 50 fichas, duas delas do noturno. O corte manda turmas inteiras para o teste, e a fração do grupo salta de 0,0% a 25,0%, e não sobe sempre, conforme as turmas que caem lá.</p>

  <p style="margin:0 0 .6em">O conjunto inteiro é sempre 1.000 fichas, 100 delas do grupo, ou 10,0%. As três colunas do gráfico são essas contagens na mesma escala: por isso a coluna do teste encolhe até um décimo e a do treino quase não se move.</p>

  <p style="margin:0"><strong>Ponto notável.</strong> O imbalanço do conjunto não é o imbalanço do teste. Com 10% de grupo no arquivo, o sorteio entrega 10% no teste; a turma inteira entrega 0% ou 33%, e nenhum dos dois números mede o modelo: mede quem caiu de cada lado do corte.</p>
