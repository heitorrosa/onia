<figure class="noic-frame-static">
  <figcaption><strong>Fig. 1</strong> (versão estática) — o que o aluno deve levar sem abrir a interação: um prompt só é auditável se declarar os critérios que a saída terá de satisfazer.</figcaption>

  <table style="width:100%;border-collapse:collapse;font-size:0.94em;margin:.4em 0 1em">
    <thead>
      <tr style="text-align:left;border-bottom:2px solid currentColor">
        <th style="padding:7px 8px 7px 0;font-weight:600">Critério</th>
        <th style="padding:7px 8px 7px 0;font-weight:600">O que pergunta</th>
        <th style="padding:7px 0 7px 0;font-weight:600">Sem ele</th>
      </tr>
    </thead>
    <tbody>
      <tr style="border-bottom:1px solid currentColor">
        <td style="padding:7px 8px 7px 0">Papel explícito</td>
        <td style="padding:7px 8px 7px 0">para quem é, com que vocabulário</td>
        <td style="padding:7px 0">a resposta muda de público a cada pedido</td>
      </tr>
      <tr style="border-bottom:1px solid currentColor">
        <td style="padding:7px 8px 7px 0">Tarefa única e delimitada</td>
        <td style="padding:7px 8px 7px 0">um verbo, um entregável</td>
        <td style="padding:7px 0">o modelo empilha três tarefas e entrega meia</td>
      </tr>
      <tr style="border-bottom:1px solid currentColor">
        <td style="padding:7px 8px 7px 0">Formato de saída</td>
        <td style="padding:7px 8px 7px 0">seções, tamanho, suporte visual</td>
        <td style="padding:7px 0">o formato é sorteado</td>
      </tr>
      <tr style="border-bottom:1px solid currentColor">
        <td style="padding:7px 8px 7px 0">Critério de fidelidade</td>
        <td style="padding:7px 8px 7px 0">como sei que está certo</td>
        <td style="padding:7px 0">"parece bom" não é verificável</td>
      </tr>
      <tr>
        <td style="padding:7px 8px 7px 0">Limite explícito</td>
        <td style="padding:7px 8px 7px 0">o que <em>não</em> fazer</td>
        <td style="padding:7px 0">o modelo inventa o que não estava no texto</td>
      </tr>
    </tbody>
  </table>

  <p style="margin:0 0 .6em"><strong>O ciclo de trabalho</strong> (a mesma sequência do frame, em texto):</p>
  <ol style="margin:0 0 1em;padding-left:1.3em">
    <li><strong>Especificar</strong> — escrever os <em>k</em> critérios antes de pedir a saída.</li>
    <li><strong>Gerar</strong> — a saída do modelo, contra os critérios.</li>
    <li><strong>Criticar</strong> — contar quantos dos <em>k</em> critérios a saída satisfaz.</li>
    <li><strong>Refinar</strong> — corrigir o prompt, não a resposta. <em>(o ciclo fecha)</em></li>
  </ol>

  <p style="margin:0">
    A contagem vira fórmula:
    \(\displaystyle \operatorname{score}(p)=\frac{1}{k}\sum_{i=1}^{k}\mathbb{1}\!\left[c_i(p)\right]\)
    — \(k\) critérios, \(k\) condições verificáveis por um terceiro, e a média entre 0 e 1 é o quanto do contrato a saída cumpriu.
  </p>
</figure>
