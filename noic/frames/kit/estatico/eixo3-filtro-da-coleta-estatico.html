<figure class="noic-frame-static">
  <figcaption><strong>Fig. 3</strong> (versão estática): o que o aluno deve levar sem abrir a interação. A exigência de histórico de crédito não tira gente de forma neutra, e a fração do grupo no arquivo cai junto.</figcaption>

  <table style="width:100%;border-collapse:collapse;font-size:0.94em;margin:.4em 0 1em">
    <thead>
      <tr style="text-align:left;border-bottom:2px solid currentColor">
        <th style="padding:7px 8px 7px 0;font-weight:600">Arquivo</th>
        <th style="padding:7px 8px 7px 0;font-weight:600">Pessoas</th>
        <th style="padding:7px 8px 7px 0;font-weight:600">Do grupo</th>
        <th style="padding:7px 8px 7px 0;font-weight:600">Do resto</th>
        <th style="padding:7px 0;font-weight:600">q</th>
      </tr>
    </thead>
    <tbody>
      <tr style="border-bottom:1px solid currentColor">
        <td style="padding:7px 8px 7px 0">sem exigência</td>
        <td style="padding:7px 8px 7px 0">200</td>
        <td style="padding:7px 8px 7px 0">36</td>
        <td style="padding:7px 8px 7px 0">164</td>
        <td style="padding:7px 0">18,0%</td>
      </tr>
      <tr>
        <td style="padding:7px 8px 7px 0">exigindo histórico</td>
        <td style="padding:7px 8px 7px 0">148</td>
        <td style="padding:7px 8px 7px 0">9</td>
        <td style="padding:7px 8px 7px 0">139</td>
        <td style="padding:7px 0">6,1%</td>
      </tr>
    </tbody>
  </table>

  <p style="margin:0 0 .6em">
    A conta: o grupo tinha 36 de 200 (\(q = 36/200 = 18{,}0\%\)); a exigência mantém 9 do grupo (25%) e 139 do resto (84,8%), e o arquivo fica com 148 pessoas. Então \(q = 9/148 = 6{,}08\%\), ou 6,1%. Saíram 27 pessoas do grupo e 25 do resto: a seleção tira do grupo cinco vezes mais, proporcionalmente.
  </p>

  <p style="margin:0 0 .6em"><strong>Ponto notável.</strong> As 27 pessoas que saíram não viraram zero: elas não geraram linha. O grupo do arquivo passa a ser medido em cima de quem sobrou, e quem lê a fração do arquivo como a fração da população erra por um fator de três.</p>

  <p style="margin:0">O filtro não sorteia: ele aplica uma regra, e a regra encontra o atributo com frequências diferentes nos dois grupos.</p>
