  <p style="margin:0 0 .6em">
    A ingestão é uma função: \(\displaystyle \phi : r_i \mapsto x_i \in \mathbb{R}^{d}\).
    O mesmo registro produz sempre o mesmo vetor - e é por isso que o experimento dá para repetir.
  </p>

  <p style="margin:0 0 .6em"><strong>Ponto notável</strong> - no extremo em que \(\phi\) não distingue dois registros, dois registros diferentes viram o mesmo ponto: a informação existia na planilha e sumiu na hora de virar vetor. No outro extremo, o registro chega intacto, com nome e data, e ninguém consegue treinar nada com isso.</p>

  <p style="margin:0">O que se ganha com a tradução: um vetor é um <strong>ponto</strong>, e um modelo é uma função sobre pontos. Com ponto dá para medir distância, somar e ajustar. Com "Ana, 16 anos", não.</p>
