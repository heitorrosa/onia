<!--title: A pilha de contexto e o cache-->
<!--
  Gêmeo estático do frame `eixo7-pilha-e-cache.html`.
  Vai no CORPO da página do WordPress, logo abaixo do iframe. É a mesma ideia
  sem JS: os botões viram uma tabela de ações e o efeito de cada uma.
-->
<figure class="noic-frame-static">
  <figcaption><strong>Fig.</strong> (versão estática): a pilha de contexto do harness, o que cada ação invalida e o que continua barato no cache.</figcaption>

  <p style="margin:0 0 .7em">
    A pilha, de cima para baixo: <strong>prompt do sistema</strong> (fixo, 1.200 tokens),
    <strong>descrição das ferramentas</strong> (fixo, 2.400),
    <strong>índice de skills</strong> (fixo, 900),
    <strong>histórico</strong> (cresce, começa com 3.000) e
    <strong>turno atual</strong> (novo, 400).
  </p>

  <table style="width:100%;border-collapse:collapse;font-size:0.9em;margin:.4em 0 1em">
    <thead>
      <tr style="text-align:left;border-bottom:2px solid currentColor">
        <th style="padding:5px 8px 5px 0;font-weight:600">ação</th>
        <th style="padding:5px 8px 5px 0;font-weight:600">o que é invalidado</th>
        <th style="padding:5px 0;font-weight:600">o que permanece no cache</th>
      </tr>
    </thead>
    <tbody>
      <tr style="border-bottom:1px solid currentColor;vertical-align:top">
        <td style="padding:5px 8px 5px 0">novo turno</td>
        <td style="padding:5px 8px 5px 0">nada: o turno anterior passa para o histórico e só o turno novo é pago por inteiro</td>
        <td style="padding:5px 0">prompt do sistema, descrição das ferramentas, índice de skills e todo o histórico</td>
      </tr>
      <tr style="border-bottom:1px solid currentColor;vertical-align:top">
        <td style="padding:5px 8px 5px 0">editar o prompt do sistema</td>
        <td style="padding:5px 8px 5px 0">a camada 1 e todas as abaixo dela: ferramentas, skills, histórico e turno atual</td>
        <td style="padding:5px 0">nada abaixo da frase alterada; o cache só vale até o ponto que não mudou</td>
      </tr>
      <tr style="border-bottom:1px solid currentColor;vertical-align:top">
        <td style="padding:5px 8px 5px 0">comprimir o histórico</td>
        <td style="padding:5px 8px 5px 0">o histórico (vira um resumo com um terço dos tokens) e o turno atual, que fica depois dele</td>
        <td style="padding:5px 0">prompt do sistema, descrição das ferramentas e índice de skills, que estão acima do histórico</td>
      </tr>
      <tr style="vertical-align:top">
        <td style="padding:5px 8px 5px 0">recomeçar</td>
        <td style="padding:5px 8px 5px 0">o estado do exercício</td>
        <td style="padding:5px 0">nada muda no contexto: a pilha volta ao estado inicial</td>
      </tr>
    </tbody>
  </table>

  <p style="margin:0 0 .6em">
    <strong>A regra:</strong> mudar algo no começo do prefixo obriga a recalcular tudo o que vem depois dele.
  </p>

  <p style="margin:0 0 .6em">
    As leituras do medidor, na ordem dos botões: inicial <strong>7.500 cacheados · 400 novos · 0,15</strong> do primeiro turno;
    após um turno <strong>7.900 · 400 · 0,15</strong>;
    após editar o sistema <strong>0 · 8.300 · 1,05</strong>;
    após comprimir <strong>4.500 · 1.533 · 0,25</strong> e 2.267 tokens saem do contexto.
  </p>

  <p style="margin:0">O custo relativo usa o preço do primeiro turno como 1,00, com o token relido valendo cerca de um décimo do token novo (fração ilustrativa).</p>
</figure>
