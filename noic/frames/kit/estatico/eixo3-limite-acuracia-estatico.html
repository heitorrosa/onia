<figure class="noic-frame-static">
<figcaption><strong>Fig. 4</strong> (versão estática): quanto a fração de labels errados (ε) impõe como teto para a acurácia de quem acerta o mundo, com δ = 3 pontos de erro do modelo.</figcaption>

  <table style="width:100%;border-collapse:collapse;font-size:0.94em;margin:.4em 0 1em">
    <thead>
      <tr style="text-align:left;border-bottom:2px solid currentColor">
        <th style="padding:7px 8px 7px 0;font-weight:600">Labels errados (ε)</th>
        <th style="padding:7px 8px 7px 0;font-weight:600">Teto do dado (1 − ε)</th>
        <th style="padding:7px 0 7px 0;font-weight:600">Acurácia do modelo (1 − ε − 3 pontos)</th>
      </tr>
    </thead>
    <tbody>
      <tr style="border-bottom:1px solid currentColor">
        <td style="padding:7px 8px 7px 0">0%</td>
        <td style="padding:7px 8px 7px 0">100%</td>
        <td style="padding:7px 0">97%</td>
      </tr>
      <tr style="border-bottom:1px solid currentColor">
        <td style="padding:7px 8px 7px 0">5%</td>
        <td style="padding:7px 8px 7px 0">95%</td>
        <td style="padding:7px 0">92%</td>
      </tr>
      <tr style="border-bottom:1px solid currentColor">
        <td style="padding:7px 8px 7px 0">10%</td>
        <td style="padding:7px 8px 7px 0">90%</td>
        <td style="padding:7px 0">87%</td>
      </tr>
      <tr>
        <td style="padding:7px 8px 7px 0">20%</td>
        <td style="padding:7px 8px 7px 0">80%</td>
        <td style="padding:7px 0">77%</td>
      </tr>
    </tbody>
  </table>

  <p style="margin:0 0 .6em">
    A fórmula que liga as colunas:
    \(\text{acurácia} \le 1 - \varepsilon\)
- o teto é do dado, e vale para quem acerta o mundo. Com ε = 10% de labels errados, mesmo o modelo perfeito (δ = 0) chega a 90% de acurácia, e um modelo com δ = 3 pontos de erro próprio chega a 87% no pior caso. Um modelo que aprende o erro dos anotadores passa do teto, e aí a acurácia alta está medindo o erro.
  </p>

<p style="margin:0 0 .6em"><strong>Ponto notável</strong> - com 10% de labels errados, mesmo um modelo perfeito chega a 90% de acurácia: o erro do dado é um teto, não um detalhe. Quem passa do teto aprendeu o erro.</p>

  <p style="margin:0">A acurácia que sobra para o modelo é a acurácia do dado menos o erro do modelo.</p>
</figure>
