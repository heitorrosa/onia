  <figcaption><strong>Fig. 9</strong> (versão estática): o que o aluno deve levar sem abrir a interação. A matriz das duas linhas: tirar a coluna do atalho derruba a acurácia do grupo em dez pontos e deixa a acurácia geral onde estava.</figcaption>

  <table style="width:100%;border-collapse:collapse;font-size:0.94em;margin:.4em 0 1em">
    <thead>
      <tr style="text-align:left;border-bottom:2px solid currentColor">

      <tr style="border-bottom:1px solid currentColor">
        <td style="padding:7px 8px 7px 0">com o CEP</td>
        <td style="padding:7px 8px 7px 0">72,0%</td>
        <td style="padding:7px 8px 7px 0">22,0%</td>
        <td style="padding:7px 0">77,6%</td>

      <tr>
        <td style="padding:7px 8px 7px 0">sem o CEP</td>

  <p style="margin:0 0 .6em">
    A conta da mistura, nas duas linhas, com \(f = 0{,}1\):
    \(0{,}1 \times 22{,}0 + 0{,}9 \times 77{,}6 = 72{,}04\) e
    \(0{,}1 \times 12{,}0 + 0{,}9 \times 78{,}7 = 72{,}03\).
    A manchete muda 0,01 ponto; o grupo perde 10. A queda do grupo entra dividida por dez, e a alta do resto entra multiplicada por nove, então as duas se cancelam no número publicado.
  </p>

  <p style="margin:0 0 .6em"><strong>Ponto notável.</strong> O CEP não é a cor nem o turno: é a coluna que serve de atalho para os dois. Enquanto ela existe, o modelo não precisa aprender nada sobre o grupo, e a acurácia por grupo mostra o sintoma sem mostrar a causa.</p>

  <p style="margin:0">Tirar a coluna e medir de novo é o teste que separa as duas: se a acurácia do grupo desaba, era ela que fazia o trabalho.</p>
