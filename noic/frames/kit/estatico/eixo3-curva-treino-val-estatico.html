  <p style="margin:0 0 .6em">
    A conta da distância entre as curvas:
    \(\text{distância} = a_{\text{treino}} - a_{\text{validação}}\)
    - com 50 registros a validação limpa fica 24 pontos atrás do treino, e a contaminada fica 8; com 1.000, a distância da limpa cai para 12,7 e a da contaminada para 4,2.
  </p>

  <p style="margin:0"><strong>Ponto notável</strong> - o vazamento não levanta só o número: ele apaga a distância. Uma curva de validação que encosta na de treino não é um modelo que aprendeu muito, é um teste que deixou de ser teste.</p>
