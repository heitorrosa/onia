  <figcaption><strong>Fig. 6</strong> (versão estática): o que o aluno deve levar sem abrir a interação. Um limiar só aplica a mesma régua a duas distribuições deslocadas, e as taxas de erro saem diferentes; um limiar por grupo iguala as taxas e move a acurácia geral.</figcaption>

  <p style="margin:0 0 .6em">
    O modelo didático da figura: o grupo tem 78 aprovados e 22 reprovados, o resto tem 698 e 202, e a nota dos dois segue a mesma forma com a média do grupo 5 pontos abaixo. Com um limiar por grupo, \(t_B = t - 5\): no limiar 50, o grupo passa a acertar 73,1% e a ter 50,0% de falso positivo, as mesmas taxas do resto. A acurácia do grupo sobe de 63,0% para 68,0% e a geral de 67,4% para 67,9%.
  </p>

  <p style="margin:0 0 .6em"><strong>Ponto notável.</strong> Um limiar só não é neutro: a mesma régua aplicada a duas distribuições que não estão no mesmo lugar produz taxas de erro diferentes, e a diferença de 9 pontos que aparece no grupo no limiar 50 é a régua, não o modelo.</p>

  <p style="margin:0">Igualar as taxas não é de graça: a acurácia geral se move, e quem paga por ela é a fila de aprovados. É por isso que a escolha do limiar é uma decisão, e não um parâmetro técnico.</p>
