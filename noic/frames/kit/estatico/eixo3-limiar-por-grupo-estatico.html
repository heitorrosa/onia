  <p style="margin:0 0 .6em">
    A matriz do grupo tem 100 fichas, 78 que passaram e 22 que não; a do resto tem 900, com 698 e 202. Cada célula traz a contagem e a taxa sobre o total do grupo. No limiar 80 a régua é a mesma nos dois grupos e o grupo fica 9,1 pontos atrás, porque a nota dele está cinco pontos abaixo.
  </p>

  <p style="margin:0 0 .6em">
    O que muda com o limiar próprio: com \(t_{\text{grupo}} = 75\), o grupo sobe de 64,0% para 73,0% de acurácia, o falso positivo vai de 5,0% para 8,0% e o falso negativo de 31,0% para 19,0%. As taxas de erro dos dois grupos se encontram (falso positivo 36,4% contra 36,1%, falso negativo 24,4% contra 24,2%), e o conjunto vai de 72,2% para 77,1%.
  </p>

  <p style="margin:0"><strong>Ponto notável.</strong> As duas notas têm a mesma forma e só estão deslocadas cinco pontos, e é por isso que o limiar do grupo alinha as curvas. A igualdade de taxas é deste cenário, não uma regra: com formas diferentes, o melhor que sai é a aproximação.</p>
