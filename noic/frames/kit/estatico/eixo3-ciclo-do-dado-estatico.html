<figure class="noic-frame-static">
  <figcaption><strong>Fig. 2</strong> (versão estática): o ciclo de vida do dado em quatro etapas, o que pode dar errado em cada uma, e o único ponto em que o dado vaza.</figcaption>

  <ol style="margin:0 0 1em;padding-left:1.3em">
    <li style="margin-bottom:.45em"><strong>Coletar</strong>: <em>o mundo cru</em>. O que pode dar errado: a mesma pessoa coletada duas vezes.</li>
    <li style="margin-bottom:.45em"><strong>Limpar</strong>: <em>duplicado, ausente</em>. O que pode dar errado: linha duplicada, campo ausente.</li>
    <li style="margin-bottom:.45em"><strong>Anotar</strong>: <em>o label</em>. O que pode dar errado: o label está errado e ninguém nota.</li>
    <li><strong>Dividir</strong>: <em>treino e teste</em>. O que pode dar errado: a mesma linha (ou a mesma pessoa) nos dois conjuntos.</li>
  </ol>

  <p style="margin:0 0 .6em"><strong>Tag de vazamento</strong> (na etapa <em>Dividir</em>): vazamento: a mesma pessoa entra no treino e no teste.</p>

  <p style="margin:0"><strong>Ponto notável</strong>: o vazamento não é erro do modelo: é erro da divisão, e aparece como uma acurácia alta que não significa nada.</p>
</figure>
